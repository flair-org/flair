[project]
name = "flair-cli"
version = "0.1.0"
description = "Flair CLI — record-only model repository and commit ledger for ML model evolution"
authors = [ { name = "Flair Contributors" } ]
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
	"flwr>=1.13,<2",
	"typer",
	"rich",
	"httpx>=0.24,<0.25",
	"pydantic",
	"pyyaml>=6.0,<7",
	"numpy>=1.26,<2",
	"onnx>=1.16,<2",
	"tf2onnx>=1.15,<2",
	"tensorflow>=2.15,<3",
	"torch>=2.2,<3",
	"ezkl>=0.4.0",
	"cryptography>=43,<44",
	"paramiko>=3.5,<4",
]

[project.scripts]
flair = "flair_cli.main:app"

[tool.poetry]
name = "flair-cli"
version = "0.1.0"
description = "Flair CLI — record-only model repository and commit ledger for ML model evolution"
authors = [ "Flair Contributors" ]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
flwr = ">=1.13,<2"
typer = "*"
rich = "*"
httpx = "^0.24"
pydantic = "*"
pyyaml = "^6.0"
numpy = "^1.26"
onnx = "^1.16"
tf2onnx = "^1.15"
tensorflow = "^2.15"
torch = "^2.2"
ezkl = ">=0.4.0"
cryptography = "^43.0"
paramiko = "^3.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"